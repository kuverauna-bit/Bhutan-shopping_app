<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="Viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayul Dream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family; Arial, sans-serif; background: #f5f1e8; padding-bottom: 60px; }
        header {background: #d71920; color: white; padding: 15px; display: flex; justify-content: space-between; align-item: center; }
        .banner { background: #ffd700; color: #d71920; text-align: center; padding: 10px; margin:10px; border-radius: 10px; font-weight: bold; }
        .section-title { font-size: 18px; font-weight:bold; margin: 15px; border-left: 4px soild #d71920; padding-left: 10px; }
        .category-grid, .products-grid { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 10px; }
        .category-card { background: white; padding: 10px 20px; border-radius: 20px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .product-name { font-weight: blod; margin: 5px 0; }
        .product-price { color: #d71920; font-weight: bold; margin: 5px 0; }
        .add-to-cart-btn { background: #d71920; color: white; border: none; padding: 8px: width: 100%; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; backgriund: white: display: flex; justify-content: space-around; padding:10px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>

<header>
    <h1>Bayul Dream</h1>
    <div>Thimphu, Bhutan</div>
</header>

<div class="banner">
    special offer! 50% OFF Local Crafts!
</div>

<div class="section-title">categories</div>
<div class="category-grid">
    <div class="category-card">Groceries</div>
    <div class="category-card">Clothing</div>
    <div class="category-card">Electronics</div>
    <div class="category-card">Books</div>
    <div class="Category-card">Gifts</div>
</div>

<div class="section-title">Trending Today</div>
<div class="product-grid">
    <div class="product-card">
        <div class="product-name">Handwoven Gho</div>
        <div class="product-price">Nu. 1,200</div>
        <button class="add-to-cart-btn" data-name="Handwoven Gho">Add to Cart</button>
    </div>
    <div class="product-card">
        <div class="product-name">Eme Datshi Mix</div>
        <div class="product-price">Nu. 180</div>
        <button class="add-to-cart-btn" data-name="Ema Datshi Mix">Add to Cart</button>
    </div>
    <div class="product-card"
        <div class="product-name">Thangka Art</div>
        <div class="product-price">Nu. 2,500</div>
        <button class="add-to-cart-btn" data-name"Thangka Art">Add to Cart</button>
    </div>
</div>

<div class="section-title">Eco-Friendly Gifts</div>
<div class="products-grid">
    <div class="product-card">
        <div class="product-name">Bamboo Set</div>
        <div class="product-price">Nu. 350</div>
        <button class="add-to-cart-btn" data-name="Bamboo Set">Add to Cart</button>
    </div>
    <div class="product-card">
        <div class="product-name">Organic Tea</div>
        <div class="product-price">Nu. 220</div>
        <button class="add-to-cart-btn" data-name="Organic Tea">Add to Cart</button>
    </div>
</div>

<div class="button-nav">
    <div>Home</div>
    <div>Favorities</div>
    <div>Cart</div>
    <div>Profile</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var buttons = document.querySelectorAll('.add-to-cart-btn');
        for (var i = 0; i <buttons.lenght; i++) {
            buttons[i].addEventListener('Click', function(event) {
                var name = this.getAttribute('data-name');
                alert(''+name + ' added to cart!');
            })
        }
    })
</script>

</body>
</html>
